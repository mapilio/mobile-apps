name: Dependency Audit

on:
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        # Fails on critical severity. Remaining build-tool findings are tracked by
        # the staged Expo upgrade in issue #74 and reviewed at every SDK boundary.
        run: npm audit --audit-level=critical
