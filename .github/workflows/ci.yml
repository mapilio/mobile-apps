name: CI

on:
  push:
    branches: [master, expo]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: Jest — run tests
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  bundle-check:
    name: Expo Bundle Smoke Test
    runs-on: ubuntu-latest
    # Only run on pushes to master to save CI minutes on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write stub .env
        run: cp .env.example .env.development

      - name: Expo export — Android bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SERVICE_URL: https://api.mapilio.com
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.stub
          EXPO_PUBLIC_AUTH_CLIENT_ID: stub
          EXPO_PUBLIC_AUTH_CLIENT_SECRET: stub
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: stub
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: stub
          EXPO_PUBLIC_SENTRY_DSN: https://stub@sentry.io/0
          EXPO_PUBLIC_ONESIGNAL_APP_ID: stub
