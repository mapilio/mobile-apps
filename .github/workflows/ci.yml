name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier — check formatting
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: Jest — run tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.29
        with:
          coverage-summary-path: coverage/coverage-summary.json
          title: Test Coverage

  bundle-check:
    name: Expo Bundle Smoke Test
    runs-on: ubuntu-latest
    # Only run on pushes to main to save CI minutes on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write stub .env
        run: cp .env.example .env.development

      - name: Expo export — Android bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SERVICE_URL: https://api.mapilio.com
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.stub
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: stub
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: stub
          EXPO_PUBLIC_SENTRY_DSN: https://stub@sentry.io/0
          EXPO_PUBLIC_ONESIGNAL_APP_ID: stub
          GOOGLE_IOS_URL_SCHEME: com.googleusercontent.apps.stub
          FACEBOOK_APP_ID: '000000000000000'
          FACEBOOK_CLIENT_TOKEN: stub
          EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
